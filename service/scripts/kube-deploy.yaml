apiVersion: apps/v1
kind: Deployment
metadata:
  name: service
  namespace: auto-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service
  template:
    metadata:
      labels:
        app: service
    spec:
      imagePullSecrets:
        - name: docker-cred
      hostUsers: false
      containers:
        - name: service
          image: ghcr.io/netlogo/auto-converter/service:964bc16
          ports:
            - containerPort: 4242
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: AC_SERVICE_PORT
              value: "4242"
            - name: AC_ALLOWED_ORIGINS
              value: "convert.netlogo.org"
          readinessProbe:
            tcpSocket:
              port: 4242
            initialDelaySeconds: 10
            periodSeconds: 10
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: auto-converter
spec:
  type: ClusterIP
  selector:
    app: service
  ports:
    - port: 4242
      targetPort: 4242
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: service
  namespace: auto-converter
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`convert.netlogo.org`) && Path(`/convert`)
      kind: Rule
      services:
        - name: service
          port: 4242
          scheme: http
  tls:
    certResolver: letsencrypt
