apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: auto-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: docker-cred
      hostUsers: false
      containers:
        - name: frontend
          image: ghcr.io/netlogo/auto-converter/frontend:b8d82bd
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 2Gi
          env:
            - name: AC_SERVICE_HOST
              value: "https://convert.netlogo.org"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: auto-converter
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend
  namespace: auto-converter
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`convert.netlogo.org`)
      kind: Rule
      services:
        - name: frontend
          port: 3000
          scheme: http
  tls:
    certResolver: letsencrypt
